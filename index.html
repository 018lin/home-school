<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>凌田家校 · 登录</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/refined-ui.css">
</head><body><main class="login-page"><div class="login-visual-logo" aria-hidden="true"><img src="assets/black.png" alt=""></div><div class="login-card"><div class="logo"></div><h1>凌田家校</h1><form id="loginForm" novalidate><div class="field"><label for="account">账号</label><input type="text" id="account" name="account" autocomplete="username"
 placeholder="请输入账号" maxlength="30" required><p class="error-msg" id="accountError" aria-live="polite"></p></div><div class="field"><label for="password">密码</label><div class="password-field"><input type="password" id="password" name="password" autocomplete="current-password"
 placeholder="请输入密码" maxlength="64" required><button type="button" class="toggle-pwd" id="togglePwd" aria-label="显示或隐藏密码"></button></div><p class="error-msg" id="passwordError" aria-live="polite"></p></div><button type="submit" class="btn-primary" id="submitBtn">登 录</button></form><p class="register-link">家长账号由管理员统一创建，请联系学校管理员</p><p class="footer-note">登录即代表同意《用户协议》与《隐私政策》</p></div></main><script src="js/api.js"></script><script src="js/login.js"></script></body></html>
