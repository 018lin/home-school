<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>教师的反馈 · 家校共育</title>
  <link rel="stylesheet" href="css/refined-ui.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --primary: #0066cc;
      --accent: #0f766e;
      --ink: #1d1d1f;
      --text-sub: #6e737d;
      --muted: #8a8f98;
      --line: #dedfe4;
      --line-soft: #eceef2;
      --canvas: #f5f6f7;
      --surface: #ffffff;
      --surface-soft: #fafafa;
    }
    body { min-height: 100vh; background: var(--canvas); color: var(--ink); font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
    .topbar { min-height: 64px; padding: 0 32px; display: flex; align-items: center; gap: 18px; background: rgba(255,255,255,0.9); border-bottom: 1px solid rgba(222,223,228,0.86); position: sticky; top: 0; z-index: 20; backdrop-filter: saturate(180%) blur(18px); }
    .brand { display: inline-flex; align-items: center; gap: 10px; color: var(--ink); font-size: 16px; font-weight: 650; white-space: nowrap; }
    .brand .logo { width: 28px; height: 28px; background: url("assets/site-logo.png") center / contain no-repeat; display: inline-block; }
    .parent-nav { display: flex; align-items: center; gap: 4px; min-width: 0; padding: 4px; overflow-x: auto; border: 1px solid var(--line-soft); border-radius: 12px; background: rgba(245,246,247,0.9); scrollbar-width: none; }
    .parent-nav::-webkit-scrollbar { display: none; }
    .nav-link { min-height: 34px; display: inline-flex; align-items: center; justify-content: center; padding: 0 13px; border-radius: 8px; color: var(--text-sub); font-size: 13px; font-weight: 650; line-height: 1; text-decoration: none; white-space: nowrap; }
    .nav-link:hover { color: var(--ink); background: rgba(255,255,255,0.82); }
    .nav-link.active { color: var(--ink); background: var(--surface); box-shadow: 0 6px 18px rgba(29,29,31,0.08); }
    .user-area { margin-left: auto; display: flex; align-items: center; gap: 10px; min-width: 0; }
    .child-switcher, .btn-logout { min-height: 40px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; }
    .child-switcher { max-width: 190px; padding: 0 10px; }
    .btn-logout { padding: 0 14px; }
    .user-name { color: var(--text-sub); font-size: 13px; white-space: nowrap; }
    .main { width: min(900px, calc(100% - 48px)); max-width: 900px; margin: 0 auto; padding: 34px 0 72px; }
    .page-title { margin-bottom: 24px; display: flex; justify-content: space-between; align-items: flex-end; gap: 18px; }
    .page-title h1 { font-size: 28px; line-height: 1.18; font-weight: 680; }
    .page-title p { margin-top: 8px; color: var(--text-sub); font-size: 14px; }
    .feedback-count { color: var(--text-sub); font-size: 13px; white-space: nowrap; }
    .feedback-list { display: grid; gap: 16px; }
    .feedback-card, .empty { background: var(--surface); border: 1px solid var(--line-soft); border-radius: 18px; box-shadow: 0 12px 40px rgba(29,29,31,0.06); padding: 24px; }
    .feedback-head { display: flex; justify-content: space-between; gap: 16px; align-items: flex-start; }
    .feedback-title { font-size: 17px; font-weight: 650; line-height: 1.4; }
    .feedback-meta { margin-top: 5px; color: var(--muted); font-size: 12px; }
    .teacher-badge { flex: 0 0 auto; min-height: 28px; display: inline-flex; align-items: center; padding: 0 10px; border-radius: 999px; background: #e9f8f0; color: var(--accent); font-size: 12px; font-weight: 650; }
    .comment { margin-top: 16px; padding: 16px; border: 1px solid #f2d7ad; border-radius: 12px; background: #fff8ed; color: var(--ink); font-size: 15px; line-height: 1.75; white-space: pre-line; }
    .work-snapshot { margin-top: 14px; padding: 14px 16px; border: 1px solid var(--line-soft); border-radius: 12px; background: var(--surface-soft); }
    .work-snapshot .label { color: var(--muted); font-size: 12px; font-weight: 650; }
    .work-snapshot p:last-child { margin-top: 6px; color: var(--text-sub); font-size: 13px; line-height: 1.65; white-space: pre-line; }
    .tags { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 6px; }
    .tag { padding: 2px 10px; border: 1px solid var(--line-soft); border-radius: 999px; background: #fff; color: var(--text-sub); font-size: 12px; }
    .empty { min-height: 320px; display: grid; place-items: center; text-align: center; color: var(--text-sub); }
    .empty h2 { color: var(--ink); font-size: 20px; }
    .empty p { margin-top: 8px; font-size: 14px; line-height: 1.7; }
    @media (max-width: 900px) { .topbar { align-items: flex-start; flex-wrap: wrap; padding: 12px 18px; gap: 10px; } .parent-nav { order: 3; width: 100%; } .user-area { margin-left: auto; } .main { width: min(100% - 40px, 760px); padding-top: 28px; } }
    @media (max-width: 640px) { .main { width: min(100% - 28px, 560px); padding-top: 22px; } .page-title, .feedback-head { display: block; } .page-title h1 { font-size: 24px; } .feedback-card, .empty { padding: 18px; border-radius: 12px; } .teacher-badge { margin-top: 12px; } .user-name { display: none; } .child-switcher { max-width: 150px; } }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="logo"></span>家校共育</div>
    <nav class="parent-nav" aria-label="家长端导航">
      <a class="nav-link" href="home.html">本周任务</a>
      <a class="nav-link" href="timeline.html">孩子成长时间线</a>
      <a class="nav-link active" href="feedback.html">教师的反馈</a>
    </nav>
    <div class="user-area">
      <select class="child-switcher" id="childSwitcher" title="切换孩子"></select>
      <span class="user-name" id="userName"></span>
      <button class="btn-logout" id="logoutBtn" type="button">退出登录</button>
    </div>
  </header>
  <main class="main">
    <div class="page-title">
      <div>
        <h1>教师的反馈</h1>
        <p>集中查看老师对每次提交的点评和能力标签。</p>
      </div>
      <span class="feedback-count" id="feedbackCount"></span>
    </div>
    <section class="empty" id="emptyState" style="display:none"><div><h2>还没有收到教师反馈</h2><p>正式提交任务后，老师点评会显示在这里。</p></div></section>
    <section class="feedback-list" id="feedbackList"></section>
  </main>
  <script src="js/api.js"></script>
  <script>
    (function () {
      "use strict";
      requireAuth();
      var auth = getAuth();
      if (auth && auth.user) {
        document.getElementById("userName").textContent = "你好，" + auth.user.displayName;
        if (auth.user.role === "teacher") { window.location.href = "teacher.html"; return; }
      }

      function populateChildren(data) {
        var switcher = document.getElementById("childSwitcher");
        switcher.innerHTML = "";
        var children = data.children || [];
        if (!children.length) {
          var opt = document.createElement("option");
          opt.textContent = "未绑定孩子";
          switcher.appendChild(opt);
          switcher.disabled = true;
          return null;
        }
        switcher.disabled = false;
        children.forEach(function (c) {
          var o = document.createElement("option");
          o.value = c.id;
          o.textContent = c.name + (c.grade ? " · " + c.grade : "");
          if (data.child && c.id === data.child.id) o.selected = true;
          switcher.appendChild(o);
        });
        return data.child && data.child.id;
      }

      function shortText(text) {
        text = String(text || "");
        return text.length > 90 ? text.slice(0, 90) + "..." : text;
      }

      function render(items, childId) {
        var feedbackItems = items.filter(function (it) { return it.feedback_id; });
        document.getElementById("feedbackCount").textContent = feedbackItems.length ? "共 " + feedbackItems.length + " 条反馈" : "";
        document.getElementById("emptyState").style.display = feedbackItems.length ? "none" : "grid";
        document.getElementById("feedbackList").innerHTML = feedbackItems.map(function (it) {
          var h = '<article class="feedback-card">';
          h += '<div class="feedback-head"><div><p class="feedback-title">' + esc(it.title) + '</p>';
          h += '<p class="feedback-meta">' + esc(it.task_type) + ' · 第 ' + esc(it.week_start) + ' 周 · 反馈于 ' + esc(it.feedback_at || it.created_at) + '</p></div>';
          h += '<span class="teacher-badge">' + esc(it.teacher_name || "老师") + '</span></div>';
          h += '<div class="comment">' + esc(it.feedback_comment || "") + '</div>';
          var tags = (it.feedback_tags || "").split(",").filter(function (t) { return t && t.trim(); });
          if (tags.length) h += '<div class="tags">' + tags.map(function (t) { return '<span class="tag">' + esc(t.trim()) + '</span>'; }).join("") + '</div>';
          h += '<div class="work-snapshot"><p class="label">本次提交</p><p>' + esc(shortText(it.content)) + '</p></div>';
          return h + '</article>';
        }).join("");
        if (feedbackItems.length) {
          trackEvent("feedback_read", { childId: childId, meta: { count: feedbackItems.length, source: "feedback-page" } });
        }
      }

      function loadFeedback(childId) {
        if (!childId) { render([], null); return; }
        trackEvent("feedback_page_viewed", { childId: childId });
        api("/api/timeline?childId=" + childId).then(function (res) {
          render(res.items || [], childId);
        }).catch(function (e) { console.error(e); render([], childId); });
      }

      function loadPage(childId) {
        api("/api/home" + (childId ? "?childId=" + childId : "")).then(function (data) {
          if (data.needQuestionnaire) { window.location.href = "questionnaire.html"; return; }
          if (data.selectedChildInvalid) localStorage.removeItem("selectedChildId");
          var selected = populateChildren(data);
          if (selected) setSelectedChildId(selected);
          loadFeedback(selected);
        }).catch(function (e) { console.error(e); render([], null); });
      }

      document.getElementById("childSwitcher").addEventListener("change", function () {
        setSelectedChildId(this.value);
        loadFeedback(this.value);
      });
      document.getElementById("logoutBtn").addEventListener("click", function () {
        api("/api/auth/logout", { method: "POST" }).catch(function () {});
        localStorage.removeItem("auth");
        localStorage.removeItem("selectedChildId");
        window.location.href = "index.html";
      });
      loadPage(getSelectedChildId());
    })();
  </script>
</body>
</html>
