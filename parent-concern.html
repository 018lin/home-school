<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>成长关注 · 家校共育</title>
  <link rel="stylesheet" href="css/refined-ui.css">
  <link rel="stylesheet" href="css/parent-home.css">
  <style>
    .parent-home.parent-concern-page:has(#childSwitcher) .main {
      display: grid !important;
      grid-template-columns: minmax(0, 1.1fr) minmax(300px, 0.9fr) !important;
      gap: 24px !important;
      align-items: start;
    }
    .concern-intro {
      grid-column: 1 / -1;
      margin-bottom: -4px;
    }
    .concern-intro h1 {
      color: var(--parent-ink);
      font-size: 28px;
      line-height: 1.25;
    }
    .concern-intro p {
      margin-top: 8px;
      color: var(--parent-sub);
      font-size: 14px;
      line-height: 1.7;
    }
    .concern-panel,
    .history-panel {
      min-width: 0;
      padding: 24px;
      border: 1px solid var(--parent-line-soft);
      border-radius: var(--parent-radius);
      background: var(--parent-surface);
      box-shadow: var(--parent-shadow);
    }
    .panel-title {
      color: var(--parent-ink);
      font-size: 18px;
      font-weight: 700;
    }
    .panel-sub {
      margin-top: 6px;
      color: var(--parent-sub);
      font-size: 13px;
      line-height: 1.65;
    }
    .notice {
      margin-top: 16px;
      padding: 12px 14px;
      border: 1px solid #d7e8f3;
      border-radius: 10px;
      background: #f5fbff;
      color: #476779;
      font-size: 12px;
      line-height: 1.7;
    }
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 18px;
    }
    .field.full { grid-column: 1 / -1; }
    .field label {
      display: block;
      margin-bottom: 6px;
      color: var(--parent-sub);
      font-size: 12px;
      font-weight: 650;
    }
    .field label span {
      color: var(--parent-muted);
      font-weight: 500;
    }
    .field input,
    .field textarea,
    .field select {
      width: 100%;
      min-height: 44px;
      padding: 10px 12px;
      border: 1px solid var(--parent-line);
      border-radius: 8px;
      background: #fff;
      color: var(--parent-ink);
      font: inherit;
      outline: none;
    }
    .field textarea {
      min-height: 88px;
      resize: vertical;
      line-height: 1.65;
    }
    .field input:focus,
    .field textarea:focus,
    .field select:focus {
      border-color: var(--parent-primary);
      box-shadow: 0 0 0 3px rgba(0, 102, 204, 0.08);
    }
    .action-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 18px;
    }
    .action-row button {
      min-height: 42px;
      padding: 0 18px;
    }
    .form-msg {
      min-height: 20px;
      margin-top: 10px;
      color: var(--parent-success);
      font-size: 12px;
      line-height: 1.5;
    }
    .request-list {
      display: grid;
      gap: 10px;
      margin-top: 16px;
    }
    .request-item {
      padding: 14px;
      border: 1px solid var(--parent-line-soft);
      border-radius: 10px;
      background: #fbfdff;
    }
    .request-item-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
    }
    .request-item strong {
      color: var(--parent-ink);
      font-size: 14px;
    }
    .request-item time {
      flex: 0 0 auto;
      color: var(--parent-muted);
      font-size: 11px;
    }
    .request-item p {
      margin-top: 8px;
      color: var(--parent-sub);
      font-size: 13px;
      line-height: 1.65;
    }
    .request-status {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      margin-top: 10px;
      padding: 0 8px;
      border-radius: 999px;
      background: #eef6ff;
      color: #216ca3;
      font-size: 11px;
      font-weight: 700;
    }
    .request-status.approved { background: #ebf8f0; color: #167044; }
    .request-status.rejected { background: #fff2ef; color: #a13a2a; }
    .empty-text {
      margin-top: 16px;
      color: var(--parent-muted);
      font-size: 13px;
      line-height: 1.6;
    }
    @media (max-width: 820px) {
      .parent-home.parent-concern-page:has(#childSwitcher) .main { grid-template-columns: 1fr !important; }
    }
    @media (max-width: 560px) {
      .concern-intro h1 { font-size: 24px; }
      .concern-panel, .history-panel { padding: 18px; }
      .form-grid { grid-template-columns: 1fr; }
      .field.full { grid-column: auto; }
      .action-row { align-items: stretch; flex-direction: column; }
      .action-row button { width: 100%; }
    }
  </style>
</head>
<body class="parent-home parent-concern-page">
  <header class="topbar">
    <div class="brand"><span class="logo"></span>家校共育</div>
    <nav class="parent-nav" aria-label="家长端导航">
      <a class="nav-link" href="home.html">本周任务</a>
      <a class="nav-link" href="timeline.html">孩子成长时间线</a>
      <a class="nav-link" href="feedback.html">教师的反馈</a>
      <a class="nav-link active" href="parent-concern.html" aria-current="page">成长关注</a>
    </nav>
    <div class="user-area">
      <select class="child-switcher" id="childSwitcher" title="切换孩子"></select>
      <span class="user-name" id="userName"></span>
      <button class="btn-logout" id="logoutBtn" type="button">退出登录</button>
    </div>
  </header>

  <main class="main">
    <div class="concern-intro">
      <h1>告诉老师最近想支持孩子的地方</h1>
      <p>请描述你观察到的具体情况。提交后，系统会先生成一份温和、低负担的任务草案，由老师审核和调整后再决定是否采用。</p>
    </div>

    <section class="concern-panel">
      <p class="panel-title">提交成长关注</p>
      <p class="panel-sub">这里不是给孩子贴标签，而是把一个具体场景交给家校一起观察。</p>
      <div class="notice">内容仅供绑定的老师和授权人员查看。系统不会根据一次描述给孩子做心理或性格判断；如涉及安全风险，老师会建议进一步联系学校专业人员。</div>
      <form id="concernForm" novalidate>
        <div class="form-grid">
          <div class="field">
            <label for="category">关注方向 <span>可选</span></label>
            <select id="category">
              <option value="">请选择</option>
              <option>情绪表达</option>
              <option>亲子沟通</option>
              <option>规则习惯</option>
              <option>责任感与自理</option>
              <option>同伴交往</option>
              <option>学习动力</option>
              <option>注意力与执行</option>
              <option>其他</option>
            </select>
          </div>
          <div class="field">
            <label for="frequency">出现频率 <span>可选</span></label>
            <select id="frequency">
              <option value="">请选择</option>
              <option>偶尔发生</option>
              <option>每周几次</option>
              <option>最近经常发生</option>
              <option>暂时说不清</option>
            </select>
          </div>
          <div class="field full">
            <label for="observedBehavior">我观察到的具体情况 <span>必填</span></label>
            <textarea id="observedBehavior" maxlength="1200" placeholder="例如：孩子遇到不会的题时会离开座位，不太愿意说自己哪里不会。"></textarea>
          </div>
          <div class="field full">
            <label for="context">通常发生在什么场景 <span>可选</span></label>
            <textarea id="context" maxlength="1000" placeholder="例如：工作日晚上写作业时，家长提醒后更容易发生。"></textarea>
          </div>
          <div class="field full">
            <label for="impact">目前对家庭有什么影响 <span>可选</span></label>
            <textarea id="impact" maxlength="800" placeholder="例如：我们容易因为这件事争执，最后孩子也不愿意继续。"></textarea>
          </div>
          <div class="field full">
            <label for="parentExpectation">希望得到什么支持 <span>可选</span></label>
            <textarea id="parentExpectation" maxlength="800" placeholder="例如：希望孩子能先说出困难，我们也想学着少一些催促。"></textarea>
          </div>
          <div class="field full">
            <label for="familyConstraints">家庭情况或执行限制 <span>可选</span></label>
            <textarea id="familyConstraints" maxlength="800" placeholder="例如：平时由奶奶陪伴，工作日晚间只有 15 分钟。"></textarea>
          </div>
          <div class="field">
            <label for="duration">希望任务时长</label>
            <select id="duration">
              <option value="10">约 10 分钟</option>
              <option value="15" selected>约 15 分钟</option>
              <option value="20">约 20 分钟</option>
              <option value="30">约 30 分钟</option>
            </select>
          </div>
        </div>
        <div class="action-row">
          <button class="btn-primary" id="submitConcern" type="submit">提交给老师</button>
        </div>
        <p class="form-msg" id="formMsg"></p>
      </form>
    </section>

    <section class="history-panel">
      <p class="panel-title">我的提交记录</p>
      <p class="panel-sub">老师审核后，处理结果和定制任务会显示在这里。</p>
      <div class="request-list" id="requestList"><p class="empty-text">正在加载…</p></div>
    </section>
  </main>

  <script src="js/api.js"></script>
  <script>
    (function () {
      "use strict";
      requireAuth();
      var auth = getAuth();
      var childId = getSelectedChildId();
      var switcher = document.getElementById("childSwitcher");
      var form = document.getElementById("concernForm");
      var submitButton = document.getElementById("submitConcern");
      var message = document.getElementById("formMsg");

      if (auth && auth.user) document.getElementById("userName").textContent = "你好，" + auth.user.displayName;

      function statusText(status) {
        return status === "approved" ? "老师已采用并生成任务" : status === "rejected" ? "老师已回复" : "等待老师审核";
      }

      function formatTime(value) {
        var date = new Date(String(value || "").replace(" ", "T"));
        return Number.isNaN(date.getTime()) ? "" : (date.getMonth() + 1) + "月" + date.getDate() + "日";
      }

      function renderChildren(data) {
        var children = data.children || [];
        switcher.innerHTML = "";
        if (!children.length) {
          switcher.innerHTML = '<option value="">未绑定孩子</option>';
          switcher.disabled = true;
          return;
        }
        switcher.disabled = false;
        children.forEach(function (child) {
          var option = document.createElement("option");
          option.value = child.id;
          option.textContent = child.name + (child.grade ? " · " + child.grade : "");
          if (String(child.id) === String(childId || (data.child && data.child.id))) option.selected = true;
          switcher.appendChild(option);
        });
        if (!childId && data.child) {
          childId = String(data.child.id);
          setSelectedChildId(childId);
        }
      }

      function renderRequests(items) {
        var list = document.getElementById("requestList");
        if (!items.length) {
          list.innerHTML = '<p class="empty-text">还没有提交过成长关注。</p>';
          return;
        }
        list.innerHTML = items.map(function (item) {
          var title = item.concern_category ? item.concern_category + "方面的成长关注" : (item.title || "孩子近期的成长关注");
          var detail = item.observed_behavior || "已提交具体情况";
          var reply = item.teacher_comment ? '<p>老师回复：' + esc(item.teacher_comment) + '</p>' : "";
          var task = item.task_title ? '<p>定制任务：' + esc(item.task_title) + '</p>' : "";
          return '<article class="request-item"><div class="request-item-top"><strong>' + esc(title) +
            '</strong><time>' + esc(formatTime(item.created_at)) + '</time></div><p>' + esc(detail) +
            '</p><span class="request-status ' + esc(item.status || "pending") + '">' + esc(statusText(item.status)) +
            '</span>' + task + reply + '</article>';
        }).join("");
      }

      function loadRequests() {
        if (!childId) {
          document.getElementById("requestList").innerHTML = '<p class="empty-text">请先绑定孩子。</p>';
          return;
        }
        api("/api/parent/task-requests?childId=" + encodeURIComponent(childId)).then(function (data) {
          renderRequests(data.requests || []);
        }).catch(function () {
          document.getElementById("requestList").innerHTML = '<p class="empty-text">记录加载失败，请刷新重试。</p>';
        });
      }

      api("/api/home").then(function (data) {
        renderChildren(data);
        if (data.needQuestionnaire) {
          window.location.href = "questionnaire.html";
          return;
        }
        loadRequests();
      });

      switcher.addEventListener("change", function () {
        childId = this.value;
        setSelectedChildId(childId);
        loadRequests();
      });

      form.addEventListener("submit", function (event) {
        event.preventDefault();
        message.style.color = "";
        message.textContent = "";
        if (!childId) {
          message.style.color = "#b42318";
          message.textContent = "请先绑定孩子";
          return;
        }
        var observedBehavior = document.getElementById("observedBehavior").value.trim();
        if (observedBehavior.length < 4) {
          message.style.color = "#b42318";
          message.textContent = "请至少写 4 个字描述具体情况";
          return;
        }
        submitButton.disabled = true;
        submitButton.textContent = "分析并提交中…";
        api("/api/parent/task-requests", {
          method: "POST",
          timeoutMs: 60000,
          body: {
            childId: Number(childId),
            category: document.getElementById("category").value,
            observedBehavior: observedBehavior,
            context: document.getElementById("context").value.trim(),
            frequency: document.getElementById("frequency").value,
            impact: document.getElementById("impact").value.trim(),
            parentExpectation: document.getElementById("parentExpectation").value.trim(),
            familyConstraints: document.getElementById("familyConstraints").value.trim(),
            duration: Number(document.getElementById("duration").value) || 15
          }
        }).then(function (result) {
          message.textContent = result.message || "已提交，等待老师审核";
          form.reset();
          document.getElementById("duration").value = "15";
          loadRequests();
        }).catch(function (error) {
          message.style.color = "#b42318";
          message.textContent = error.message || "提交失败，请稍后重试";
        }).finally(function () {
          submitButton.disabled = false;
          submitButton.textContent = "提交给老师";
        });
      });

      document.getElementById("logoutBtn").addEventListener("click", function () {
        api("/api/auth/logout", { method: "POST" }).catch(function () {});
        localStorage.removeItem("auth");
        localStorage.removeItem("selectedChildId");
        window.location.href = "index.html";
      });
    })();
  </script>
</body>
</html>
