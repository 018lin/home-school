<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>全局概览 · 家校共育</title>
  <link rel="stylesheet" href="css/refined-ui.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body class="admin-page">
  <header class="topbar">
    <span class="brand">管理员工作台</span>
    <nav class="teacher-nav" aria-label="管理员导航">
      <a class="nav-link active" href="admin.html">全局概览</a>
      <a class="nav-link" href="admin-tasks.html">已发布任务</a>
      <a class="nav-link" href="teacher-ai.html">AI 洞察</a>
      <a class="nav-link" href="teacher-students.html">学生档案</a>
    </nav>
    <div class="top-actions">
      <span class="user-name" id="userName"></span>
      <button class="btn-logout" id="logoutBtn" type="button">退出登录</button>
    </div>
  </header>

  <main class="admin-main">
    <section class="admin-heading" aria-labelledby="adminTitle">
      <div>
        <span class="eyebrow">系统管理 / 总览</span>
        <h1 id="adminTitle">全局概览</h1>
        <p>查看当前平台的教师与学生规模，进入 AI 洞察和学生档案。</p>
      </div>
      <span class="updated-at" id="updatedAt">正在同步…</span>
    </section>

    <section class="metric-grid" id="metricGrid" aria-label="平台统计">
      <article class="metric-card"><span>已注册教师</span><strong id="teacherCount">—</strong><small>可进入教师工作台</small></article>
      <article class="metric-card"><span>已登记学生</span><strong id="studentCount">—</strong><small>已建立学生档案</small></article>
      <article class="metric-card"><span>家长账号</span><strong id="parentCount">—</strong><small>用于接收家校通知</small></article>
    </section>

    <section class="directory-grid">
      <article class="directory-panel">
        <div class="panel-heading"><div><span class="eyebrow">账号目录</span><h2>教师</h2></div><span class="panel-count" id="teacherPanelCount">—</span></div>
        <div class="table-wrap"><table><thead><tr><th>账号</th><th>称呼</th><th>注册时间</th></tr></thead><tbody id="teacherList"><tr><td colspan="3" class="table-state">正在加载…</td></tr></tbody></table></div>
      </article>
      <article class="directory-panel">
        <div class="panel-heading"><div><span class="eyebrow">档案目录</span><h2>学生</h2></div><span class="panel-count" id="studentPanelCount">—</span></div>
        <div class="table-wrap"><table><thead><tr><th>学生</th><th>年级</th><th>关联家长</th></tr></thead><tbody id="studentList"><tr><td colspan="3" class="table-state">正在加载…</td></tr></tbody></table></div>
      </article>
    </section>
  </main>

  <script src="js/api.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
