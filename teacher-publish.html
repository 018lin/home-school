<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>发布任务 · 家校共育</title><style>
 * { margin: 0; padding: 0; box-sizing: border-box; }
 :root {
 --primary: #3b82f6; --text: #1f2937; --text-sub: #6b7280; --border: #e5e7eb;
 }
 body {
 min-height: 100vh; font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
 background: linear-gradient(160deg, #eff6ff 0%, #f0fdf4 100%); color: var(--text);
 }
 .topbar {
 display: flex; align-items: center; gap: 18px; padding: 12px 20px;
 background: rgba(255,255,255,0.88); border-bottom: 1px solid var(--border);
 position: sticky; top: 0; z-index: 10; backdrop-filter: blur(10px);
 }
 .brand { font-size: 16px; font-weight: 700; white-space: nowrap; }
 .teacher-nav { display: flex; align-items: center; gap: 6px; flex: 1; overflow-x: auto; }
 .nav-link {
 flex: 0 0 auto; padding: 7px 12px; border-radius: 8px; color: var(--text-sub);
 text-decoration: none; font-size: 14px; font-weight: 600;
 }
 .nav-link:hover { color: var(--primary); background: #eff6ff; }
 .nav-link.active { color: #1d4ed8; background: #dbeafe; }
 .top-actions { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
 .user-name { font-size: 13px; color: var(--text-sub); white-space: nowrap; }
 .btn-logout {
 padding: 6px 12px; border: 1px solid var(--border); border-radius: 8px;
 background: #fff; color: var(--text-sub); font-size: 13px; cursor: pointer;
 }
 .btn-logout:hover { color: var(--primary); border-color: var(--primary); }
 .main { max-width: 640px; margin: 0 auto; padding: 24px 20px 48px; }
 .publish-panel {
 background: #fff; border: 1px solid var(--border); border-radius: 12px;
 box-shadow: 0 4px 20px rgba(59,130,246,0.08); padding: 20px;
 }
 .panel-title { font-size: 16px; font-weight: 700; }
 .panel-sub { margin-top: 4px; font-size: 13px; color: var(--text-sub); line-height: 1.6; }
 .field { margin-top: 12px; }
 .field label { display: block; font-size: 12px; color: var(--text-sub); margin-bottom: 6px; }
 .field input, .field textarea, .field select {
 width: 100%; border: 1px solid var(--border); border-radius: 8px;
 padding: 10px 12px; font-size: 14px; font-family: inherit; outline: none; background: #fff;
 }
 .field textarea { min-height: 76px; resize: vertical; line-height: 1.6; }
 .field input:focus, .field textarea:focus, .field select:focus { border-color: var(--primary); }
 .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
 .btn-primary {
 width: 100%; height: 42px; margin-top: 14px; border: none; border-radius: 8px;
 background: var(--primary); color: #fff; font-size: 14px; font-weight: 700; cursor: pointer;
 }
 .btn-primary:disabled { background: #93c5fd; cursor: not-allowed; }
 .form-msg { min-height: 18px; margin-top: 8px; font-size: 12px; color: #16a34a; }
 @media (max-width: 700px) {
 .topbar { align-items: flex-start; gap: 10px; flex-wrap: wrap; }
 .teacher-nav { order: 3; width: 100%; flex-basis: 100%; }
 .top-actions { margin-left: auto; }
 }
 @media (max-width: 520px) { .row2 { grid-template-columns: 1fr; } }
 </style><link rel="stylesheet" href="css/refined-ui.css">
</head><body><header class="topbar"><span class="brand">教师工作台</span><nav class="teacher-nav" aria-label="教师端导航"><a class="nav-link" href="teacher.html">全局报告</a><a class="nav-link" href="teacher-class-overview.html">班级概览</a><a class="nav-link active" href="teacher-publish.html">发布任务</a><a class="nav-link" href="teacher-submissions.html">学生提交</a><a class="nav-link" href="teacher-students.html">学生档案</a></nav><div class="top-actions"><span class="user-name" id="userName"></span><button class="btn-logout" id="logoutBtn">退出登录</button></div></header><main class="main"><section class="publish-panel"><p class="panel-title">发布本周亲子任务</p><p class="panel-sub">从模板带出任务卡，老师可微调后发布给全班。</p><div class="field"><label>任务模板</label><select id="templateSelect"></select></div><div class="field"><label>任务标题</label><input id="pubTitle" maxlength="50"></div><div class="row2"><div class="field"><label>任务类型</label><select id="pubType"><option>阅读</option><option>习惯养成</option><option>学科应用</option><option>情绪社交</option><option>家务实践</option><option>运动健身</option><option>观察探究</option></select></div><div class="field"><label>预计时长</label><input id="pubDuration" type="number" min="5" max="60"></div></div><div class="row2"><div class="field"><label>难度</label><select id="pubDifficulty"><option>简单</option><option selected>普通</option><option>进阶</option></select></div><div class="field"><label>所需材料</label><input id="pubMaterials" maxlength="80"></div></div><div class="field"><label>目标</label><input id="pubGoal" maxlength="100"></div><div class="field"><label>亲子步骤</label><textarea id="pubSteps"></textarea></div><div class="field"><label>对话提示</label><input id="pubTips" maxlength="100"></div><div class="field"><label>提交要求</label><input id="pubSubmit" maxlength="100"></div><div class="field"><label>替代方案</label><input id="pubFallback" maxlength="120"></div><button class="btn-primary" id="publishBtn">发布给全班</button><p class="form-msg" id="publishMsg"></p></section></main><script src="js/api.js"></script><script>
 (function () {
 "use strict";
 requireAuth();
 var auth = getAuth();
 if (auth && auth.user) {
 if (auth.user.role !== "teacher") { window.location.href = "home.html"; return; }
 document.getElementById("userName").textContent = "你好，" + auth.user.displayName;
 }
 document.getElementById("logoutBtn").addEventListener("click", function () {
 api("/api/auth/logout", { method: "POST" }).catch(function () {});
 localStorage.removeItem("auth");
 window.location.href = "index.html";
 });

 var TASK_TEMPLATES = [
 { title: "亲子共读：共读一本好书", type: "阅读", duration: 20, difficulty: "普通", materials: "一本课外书", goal: "营造家庭阅读氛围，培养孩子表达与思考能力", steps: "1. 和孩子一起选一本想读的书\n2. 安静共读 20 分钟\n3. 分享各自最喜欢的段落\n4. 讨论故事中的道理", tips: "你觉得这个故事里，如果你是主角会怎么做？", submit: "拍照、语音或写一段读后感", fallback: "时间有限时可共读一个章节，祖辈陪伴可改为听孩子讲故事" },
 { title: "家庭观察：一起种一颗豆子", type: "观察探究", duration: 15, difficulty: "简单", materials: "豆子、纸巾或小杯子", goal: "培养观察能力与责任感", steps: "1. 一起泡豆子\n2. 每天观察记录变化\n3. 周末一起画出变化\n4. 讨论植物生长需要什么", tips: "你觉得它明天会有什么变化？为什么？", submit: "照片或文字记录观察发现", fallback: "没有豆子时可观察家里的一盆植物或窗外天气" },
 { title: "整理小能手：书桌大变身", type: "家务实践", duration: 20, difficulty: "简单", materials: "书桌、收纳盒可选", goal: "培养整理习惯和家庭责任感", steps: "1. 一起观察书桌现状\n2. 分类书本和文具\n3. 决定保留和归位\n4. 整理后一起拍照复盘", tips: "整理之后，你觉得哪里最方便？", submit: "整理前后照片或一句感受", fallback: "空间有限时只整理一个抽屉或书包" },
 { title: "情绪卡片：画出今天的心情", type: "情绪社交", duration: 15, difficulty: "简单", materials: "纸和彩笔", goal: "帮助孩子识别并表达情绪", steps: "1. 家长和孩子各画一张心情卡\n2. 互相介绍自己的画\n3. 说一件让自己有这种心情的事\n4. 一起想一个让心情变好的方法", tips: "今天最开心或最难过的事是什么？", submit: "拍照心情卡片或录一段分享", fallback: "没有彩笔时可用表情或口头描述代替" },
 { title: "生活数学：超市小账本", type: "学科应用", duration: 25, difficulty: "普通", materials: "购物清单或小票", goal: "把数学应用到真实生活场景", steps: "1. 一起列购物清单\n2. 给孩子一个预算\n3. 让孩子估算价格\n4. 结账后核对差距", tips: "为什么同样的东西价格会不一样？", submit: "小票照片或计算过程", fallback: "不去超市时可用家中物品模拟标价" },
 { title: "亲子运动：一起跳绳", type: "运动健身", duration: 15, difficulty: "普通", materials: "跳绳", goal: "在运动中增进亲子默契", steps: "1. 家长先示范\n2. 孩子尝试跳绳\n3. 互相计数和鼓励\n4. 记录一次小进步", tips: "一起运动和一个人运动有什么不同？", submit: "运动照片、视频或一句感受", fallback: "没有跳绳时可改为原地开合跳或散步计步" },
 { title: "早睡早起挑战周", type: "习惯养成", duration: 10, difficulty: "普通", materials: "作息记录表", goal: "帮助孩子建立稳定作息", steps: "1. 约定睡觉和起床时间\n2. 制作简单打卡表\n3. 每天完成后打勾\n4. 周末一起回顾变化", tips: "早睡后第二天感觉有什么不同？", submit: "打卡表照片或文字总结", fallback: "只做三天小挑战也可以，重点是一起复盘" },
 { title: "角色互换：今天我来当大人", type: "情绪社交", duration: 20, difficulty: "进阶", materials: "一个家庭场景", goal: "培养换位思考和表达能力", steps: "1. 选一个生活场景\n2. 孩子扮演大人\n3. 家长扮演孩子\n4. 结束后互相说感受", tips: "当大人的感觉和你想象中一样吗？", submit: "一段对话记录或感受", fallback: "孩子害羞时可只做口头讨论" },
 { title: "厨房协作：一起做一道凉菜", type: "家务实践", duration: 25, difficulty: "普通", materials: "简单食材、餐具", goal: "培养生活技能和合作意识", steps: "1. 一起决定做什么\n2. 分工清洗和摆盘\n3. 家长负责安全步骤\n4. 一起品尝并收拾", tips: "你觉得合作时最重要的是什么？", submit: "成品照片或语音分享", fallback: "不方便做菜时可改为一起摆餐桌" },
 { title: "自然探索：小区里的秘密", type: "观察探究", duration: 20, difficulty: "普通", materials: "手机拍照可选", goal: "培养观察力和科学探究兴趣", steps: "1. 到楼下或窗边观察\n2. 找到三种植物或昆虫\n3. 说说它们的特点\n4. 回家查一个小知识", tips: "它为什么会生活在这里？", submit: "照片记录或一句发现", fallback: "天气不好时可观察家中物品的材质和形状" }
 ];

 function fillTemplate(tpl) {
 document.getElementById("pubTitle").value = tpl.title;
 document.getElementById("pubType").value = tpl.type;
 document.getElementById("pubDuration").value = tpl.duration;
 document.getElementById("pubDifficulty").value = tpl.difficulty;
 document.getElementById("pubMaterials").value = tpl.materials;
 document.getElementById("pubGoal").value = tpl.goal;
 document.getElementById("pubSteps").value = tpl.steps;
 document.getElementById("pubTips").value = tpl.tips;
 document.getElementById("pubSubmit").value = tpl.submit;
 document.getElementById("pubFallback").value = tpl.fallback;
 }

 var templateSelect = document.getElementById("templateSelect");
 templateSelect.innerHTML = TASK_TEMPLATES.map(function (tpl, idx) {
 return '<option value="' + idx + '">' + esc(tpl.title) + " · " + esc(tpl.type) + '</option>';
 }).join("");
 fillTemplate(TASK_TEMPLATES[0]);
 templateSelect.addEventListener("change", function () {
 fillTemplate(TASK_TEMPLATES[Number(this.value)] || TASK_TEMPLATES[0]);
 });

 document.getElementById("publishBtn").addEventListener("click", function () {
 var btn = this;
 var msg = document.getElementById("publishMsg");
 var title = document.getElementById("pubTitle").value.trim();
 msg.style.color = "#16a34a";
 msg.textContent = "";
 if (!title) { msg.style.color = "#dc2626"; msg.textContent = "请填写任务标题"; return; }
 btn.disabled = true;
 btn.textContent = "发布中…";
 api("/api/teacher/tasks", {
 method: "POST",
 body: {
 title: title,
 type: document.getElementById("pubType").value,
 duration: Number(document.getElementById("pubDuration").value) || 20,
 difficulty: document.getElementById("pubDifficulty").value,
 materials: document.getElementById("pubMaterials").value.trim(),
 goal: document.getElementById("pubGoal").value.trim(),
 steps: document.getElementById("pubSteps").value.trim(),
 dialogueTips: document.getElementById("pubTips").value.trim(),
 submitHint: document.getElementById("pubSubmit").value.trim(),
 fallbackPlan: document.getElementById("pubFallback").value.trim()
 }
 }).then(function (res) {
 btn.disabled = false;
 btn.textContent = "发布给全班";
 if (res.ok) {
 msg.textContent = "已发布，本周任务会出现在家长端";
 } else {
 msg.style.color = "#dc2626";
 msg.textContent = res.message || "发布失败";
 }
 }).catch(function () {
 btn.disabled = false;
 btn.textContent = "发布给全班";
 msg.style.color = "#dc2626";
 msg.textContent = "网络异常，请稍后再试";
 });
 });
 })();
 </script></body></html>
