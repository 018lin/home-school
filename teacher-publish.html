 fillTemplate(TASK_TEMPLATES[Number(this.value)] || TASK_TEMPLATES[0]);
 });

 document.getElementById("publishBtn").addEventListener("click", function () {
 var btn = this;
 var msg = document.getElementById("publishMsg");
 var title = document.getElementById("pubTitle").value.trim();
 msg.style.color = "#16a34a";
 msg.textContent = "";
 if (!title) { msg.style.color = "#dc2626"; msg.textContent = "请填写任务标题"; return; }
 btn.disabled = true;
 btn.textContent = "发布中…";
 api("/api/teacher/tasks", {
 method: "POST",
 body: {
 title: title,
 type: document.getElementById("pubType").value,
 duration: Number(document.getElementById("pubDuration").value) || 20,
 difficulty: document.getElementById("pubDifficulty").value,
 materials: document.getElementById("pubMaterials").value.trim(),
 goal: document.getElementById("pubGoal").value.trim(),
 steps: document.getElementById("pubSteps").value.trim(),
 dialogueTips: document.getElementById("pubTips").value.trim(),
 submitHint: document.getElementById("pubSubmit").value.trim(),
 fallbackPlan: document.getElementById("pubFallback").value.trim()
 }
 }).then(function (res) {
 btn.disabled = false;
 btn.textContent = "发布给全班";
 if (res.ok) {
 msg.textContent = "已发布，本周任务会出现在家长端";
 } else {
 msg.style.color = "#dc2626";
 msg.textContent = res.message || "发布失败";
 }
 }).catch(function () {
 btn.disabled = false;
 btn.textContent = "发布给全班";
 msg.style.color = "#dc2626";
 msg.textContent = "网络异常，请稍后再试";
 });
 });

 function requestStatusText(status) {
 return status === "approved" ? "已同意" : status === "rejected" ? "已拒绝" : "待审核";
 }

 function parseAiPlan(req) {
 try { return JSON.parse(req.ai_plan || "{}") || {}; } catch (e) { return {}; }
 }

 function taskTypeOptions(selected) {
 var types = ["阅读", "习惯养成", "学科应用", "情绪社交", "家务实践", "运动健身", "观察探究"];
 return types.map(function (type) {
 return '<option' + (type === selected ? ' selected' : '') + '>' + esc(type) + '</option>';
 }).join("");
 }

 function defaultTaskFromRequest(req) {
 var plan = parseAiPlan(req);
 var aiTask = plan.task || {};
 return {
  title: aiTask.title || req.title || "家长自主定制任务",
  type: aiTask.type || "家务实践",
  duration: Number(aiTask.duration) || Number(req.duration) || 20,
  difficulty: aiTask.difficulty || "普通",
  materials: aiTask.materials || "按家庭实际准备",
  goal: aiTask.goal || req.goal || "结合家庭意愿开展一次亲子活动",
  steps: aiTask.steps || req.description || "",
  tips: aiTask.dialogueTips || "和孩子聊聊：这件事最有意思、最困难的地方分别是什么？",
  submit: aiTask.submitHint || "可提交照片、文字记录或一段亲子对话",
  fallback: aiTask.fallbackPlan || "时间有限时可缩短步骤，只保留一次共同完成和一次交流",
  plan: plan
  };
 }

 var parentRequests = [];
 var activeRequestId = null;

 function requestPreviewText(req) {
 return req.observed_behavior || req.description || req.context || req.parent_expectation || req.goal || "家长已提交一项亲子任务提议";
 }

 function renderRequestThumb(req) {
 var task = defaultTaskFromRequest(req);
 var meta = [(req.grade || ""), (req.parent_name || "家长")].filter(Boolean).join(" · ");
 var foot = req.concern_category || task.type || "提交项目";
 var h = '<button class="request-thumb" type="button" data-id="' + req.id + '">';
 h += '<div class="request-thumb-top"><div><p class="request-thumb-name">' + esc(req.child_name || "学生") + '</p>';
 h += '<p class="request-thumb-meta">' + esc(meta || "家庭提议") + '</p></div>';
 h += '<em class="request-status ' + esc(req.status) + '">' + requestStatusText(req.status) + '</em></div>';
 h += '<p class="request-thumb-title">' + esc(task.title) + '</p>';
 h += '<p class="request-thumb-desc">' + esc(requestPreviewText(req)) + '</p>';
 h += '<div class="request-thumb-foot"><span>' + esc(foot) + '</span><span class="request-thumb-link">查看详情</span></div>';
 h += '</button>';
 return h;
 }

 function renderRequestDetail(req) {
 var task = defaultTaskFromRequest(req);
 var h = '<article class="parent-request-item" data-id="' + req.id + '">';
 h += '<div class="parent-request-top"><div><strong>' + esc(req.child_name || "学生") + '</strong><span>' + esc((req.grade || "") + " · " + (req.parent_name || "家长")) + '</span></div><em class="request-status ' + esc(req.status) + '">' + requestStatusText(req.status) + '</em></div>';
  h += '<div class="parent-request-original"><b>家长观察</b>';
  h += (req.concern_category ? '<p>关注方向：' + esc(req.concern_category) + '</p>' : '');
  h += '<p>' + esc(req.observed_behavior || req.description || "") + '</p>';
  h += (req.context ? '<p>发生场景：' + esc(req.context) + '</p>' : '');
  h += (req.frequency ? '<p>出现频率：' + esc(req.frequency) + '</p>' : '');
  h += (req.impact ? '<p>家庭影响：' + esc(req.impact) + '</p>' : '');
  h += (req.parent_expectation || req.goal ? '<p>家长期待：' + esc(req.parent_expectation || req.goal) + '</p>' : '');
  h += (req.family_constraints ? '<p>执行限制：' + esc(req.family_constraints) + '</p>' : '') + '</div>';
  if (task.plan && task.plan.analysisSummary) {
  h += '<div class="ai-request-plan is-collapsed"><div class="ai-request-plan-head"><b>AI 分析报告</b><span>' +
    esc(req.ai_status === "ai" ? "AI 已生成" : "基础规则兜底") + '</span></div>';
  h += '<div class="ai-request-plan-body">';
  h += '<p>' + esc(task.plan.analysisSummary) + '</p>';
  if (task.plan.supportGoal) h += '<p><b>支持目标：</b>' + esc(task.plan.supportGoal) + '</p>';
  if (task.plan.boundaryNote) h += '<p><b>边界提示：</b>' + esc(task.plan.boundaryNote) + '</p>';
  if (task.plan.needsProfessionalReview) h += '<p class="ai-risk">包含需要进一步人工了解的风险信号，请谨慎决定是否适合用家庭任务处理。</p>';
  h += '</div><button class="ai-request-toggle" type="button" aria-expanded="false">展开详情</button></div>';
  }
 if (req.status === "pending") {
 h += '<div class="field"><label>任务标题</label><input class="pr-title" maxlength="80" value="' + esc(task.title) + '"></div>';
  h += '<div class="row2"><div class="field"><label>任务类型</label><select class="pr-type">' + taskTypeOptions(task.type) + '</select></div><div class="field"><label>预计时长</label><input class="pr-duration" type="number" min="5" max="90" value="' + task.duration + '"></div></div>';
  h += '<div class="row2"><div class="field"><label>难度</label><select class="pr-difficulty"><option' + (task.difficulty === "简单" ? ' selected' : '') + '>简单</option><option' + (task.difficulty === "普通" ? ' selected' : '') + '>普通</option><option' + (task.difficulty === "进阶" ? ' selected' : '') + '>进阶</option></select></div><div class="field"><label>所需材料</label><input class="pr-materials" maxlength="180" value="' + esc(task.materials) + '"></div></div>';
 h += '<div class="field"><label>目标</label><input class="pr-goal" maxlength="180" value="' + esc(task.goal) + '"></div>';
 h += '<div class="field"><label>实施步骤</label><textarea class="pr-steps">' + esc(task.steps) + '</textarea></div>';
 h += '<div class="field"><label>对话提示</label><input class="pr-tips" maxlength="200" value="' + esc(task.tips) + '"></div>';
 h += '<div class="field"><label>提交要求</label><input class="pr-submit" maxlength="200" value="' + esc(task.submit) + '"></div>';
  h += '<div class="field"><label>替代方案</label><input class="pr-fallback" maxlength="240" value="' + esc(task.fallback) + '"></div>';
 h += '<div class="field"><label>教师评价</label><textarea class="pr-comment" placeholder="同意时可写鼓励，拒绝时需说明原因或替代建议"></textarea></div>';
 h += '<div class="request-sticky-actions"><div class="request-actions"><button class="btn-confirm pr-approve" type="button">同意实施</button><button class="btn-cancel pr-reject" type="button">拒绝并评价</button></div><p class="form-msg pr-msg"></p></div>';
 } else {
 h += '<div class="parent-request-original"><b>教师评价</b><p>' + esc(req.teacher_comment || "暂无") + '</p>' + (req.task_title ? '<p>已生成任务：' + esc(req.task_title) + '</p>' : '') + '</div>';
 }
 h += '</article>';
 return h;
 }

 function renderParentRequests(requests) {
 var list = document.getElementById("parentRequestList");
 var count = document.getElementById("requestCount");
 parentRequests = requests;
 var pending = requests.filter(function (r) { return r.status === "pending"; }).length;
 count.textContent = requests.length ? (requests.length + " 项" + (pending ? " · " + pending + " 待处理" : " · 已处理")) : "";
 if (!requests.length) {
 list.innerHTML = '<p class="empty-text">暂无家长自主定制任务提议</p>';
 return;
 }
 list.innerHTML = requests.map(renderRequestThumb).join("");
 }

 function findRequest(id) {
 id = Number(id);
 return parentRequests.find(function (req) { return Number(req.id) === id; });
 }

 function openRequestModal(id) {
 var req = findRequest(id);
 if (!req) return;
 activeRequestId = Number(req.id);
 document.getElementById("requestModalTitle").textContent = (req.child_name || "学生") + "的提交项目详情";
 document.getElementById("requestModalSub").textContent = (req.grade || "班级") + " · " + (req.parent_name || "家长") + " · " + requestStatusText(req.status);
 var body = document.getElementById("requestModalBody");
 body.innerHTML = renderRequestDetail(req);
 fitAllTextareas(body);
 document.getElementById("requestModal").classList.add("show");
 document.getElementById("requestModal").setAttribute("aria-hidden", "false");
 document.body.classList.add("request-modal-open");
 document.getElementById("requestModalClose").focus();
 }

 function closeRequestModal() {
 activeRequestId = null;
 document.getElementById("requestModal").classList.remove("show");
 document.getElementById("requestModal").setAttribute("aria-hidden", "true");
 document.body.classList.remove("request-modal-open");
 document.getElementById("requestModalBody").innerHTML = "";
 }

 function loadParentRequests() {
 api("/api/teacher/parent-task-requests").then(function (data) {
 renderParentRequests(data.requests || []);
 }).catch(function () {
 document.getElementById("parentRequestList").innerHTML = '<p class="empty-text">加载失败，请刷新重试</p>';
 });
 }

 function reviewParentRequest(item, status) {
 var msg = item.querySelector(".pr-msg");
 var comment = item.querySelector(".pr-comment").value.trim();
 msg.style.color = "";
 msg.textContent = "";
 if (status === "rejected" && !comment) { msg.style.color = "#dc2626"; msg.textContent = "拒绝时请填写评价或原因"; return; }
 var buttons = item.querySelectorAll("button");
 buttons.forEach(function (btn) { btn.disabled = true; });
 api("/api/teacher/parent-task-requests/review", {
 method: "POST",
 body: {
 requestId: Number(item.getAttribute("data-id")),
 status: status,
 teacherComment: comment,
 title: item.querySelector(".pr-title").value.trim(),
 type: item.querySelector(".pr-type").value,
 duration: Number(item.querySelector(".pr-duration").value) || 20,
              difficulty: item.querySelector(".pr-difficulty").value,
              materials: item.querySelector(".pr-materials").value.trim(),
 goal: item.querySelector(".pr-goal").value.trim(),
 steps: item.querySelector(".pr-steps").value.trim(),
 dialogueTips: item.querySelector(".pr-tips").value.trim(),
              submitHint: item.querySelector(".pr-submit").value.trim(),
              fallbackPlan: item.querySelector(".pr-fallback").value.trim()
 }
 }).then(function (res) {
 if (res.ok) {
 closeRequestModal();
 loadParentRequests();
 }
 else {
 buttons.forEach(function (btn) { btn.disabled = false; });
 msg.style.color = "#dc2626";
 msg.textContent = res.message || "处理失败";
 }
 }).catch(function () {
 buttons.forEach(function (btn) { btn.disabled = false; });
 msg.style.color = "#dc2626";
 msg.textContent = "网络异常，请稍后重试";
 });
 }

 document.getElementById("parentRequestList").addEventListener("click", function (e) {
 var card = e.target.closest(".request-thumb");
 if (!card) return;
 openRequestModal(card.getAttribute("data-id"));
 });

 document.getElementById("requestModalBody").addEventListener("click", function (e) {
 var toggle = e.target.closest(".ai-request-toggle");
 if (toggle) {
 var plan = toggle.closest(".ai-request-plan");
 var expanded = !plan.classList.contains("is-expanded");
 plan.classList.toggle("is-expanded", expanded);
 plan.classList.toggle("is-collapsed", !expanded);
 toggle.setAttribute("aria-expanded", expanded ? "true" : "false");
 toggle.textContent = expanded ? "收起详情" : "展开详情";
 return;
 }
 var approve = e.target.closest(".pr-approve");
 var reject = e.target.closest(".pr-reject");
 if (!approve && !reject) return;
 var item = e.target.closest(".parent-request-item");
 reviewParentRequest(item, approve ? "approved" : "rejected");
 });

 document.getElementById("requestModalClose").addEventListener("click", closeRequestModal);
 document.getElementById("requestModal").addEventListener("click", function (e) {
 if (e.target === this) closeRequestModal();
 });
 document.addEventListener("keydown", function (e) {
 if (e.key === "Escape" && document.getElementById("requestModal").classList.contains("show")) closeRequestModal();
 });

 loadParentRequests();
 })();
 </script></body></html>
