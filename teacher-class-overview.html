</head><body class="teacher-overview"><header class="topbar"><span class="brand">教师工作台</span><nav class="teacher-nav" aria-label="教师端导航"><a class="nav-link" href="teacher.html">全局报告</a><a class="nav-link" href="teacher-ai.html">AI 洞察</a><a class="nav-link active" href="teacher-class-overview.html">班级概览</a><a class="nav-link" href="teacher-publish.html">发布任务</a><a class="nav-link" href="teacher-submissions.html">学生提交</a><a class="nav-link" href="teacher-students.html">学生档案</a></nav><div class="top-actions"><span class="user-name" id="userName"></span><button class="btn-logout" id="logoutBtn">退出登录</button></div></header><main class="main"><div class="overview-shell" id="overviewCard"><div id="overviewBody"><p class="empty">正在加载班级数据…</p></div></div></main><script src="js/api.js"></script><script>
 (function () {
 "use strict";
 requireAuth();
 var auth = getAuth();
 if (auth && auth.user) {
 if (auth.user.role !== "teacher") { window.location.href = "home.html"; return; }
 document.getElementById("userName").textContent = "你好，" + auth.user.displayName;
 }
 document.getElementById("logoutBtn").addEventListener("click", function () {
 api("/api/auth/logout", { method: "POST" }).catch(function () {});
 localStorage.removeItem("auth");
 window.location.href = "index.html";
 });

 var COLORS = ["#8b5cf6", "#3b82f6", "#16a34a", "#f59e0b", "#ec4899", "#06b6d4", "#6366f1"];

 function renderDist(title, dist) {
 var entries = Object.entries(dist).filter(function (e) { return e[1] > 0; });
 if (entries.length === 0) return "";
 var total = entries.reduce(function (s, e) { return s + e[1]; }, 0);
 var html = '<div class="dist-panel"><div class="dist-title">' + esc(title) + '</div>';
 html += '<div class="dist-bar">';
 entries.forEach(function (e, i) {
 var pct = Math.round(e[1] / total * 100);
 var color = COLORS[i % COLORS.length];
 html += '<div class="dist-segment" style="width:' + pct + '%;background:' + color + '" title="' + esc(e[0]) + ': ' + e[1] + '">' + (pct >= 16 && String(e[0]).length <= 4 ? esc(e[0]) : "") + '</div>';
 });
 html += '</div><div class="dist-legend">';
 entries.forEach(function (e, i) {
 var color = COLORS[i % COLORS.length];
 html += '<span><span class="dot" style="background:' + color + '"></span>' + esc(e[0]) + ' (' + e[1] + ')</span>';
 });
 html += '</div><div class="dist-progress-list">';
 entries.forEach(function (e, i) {
 var pct = Math.round(e[1] / total * 100);
 var color = COLORS[i % COLORS.length];
 html += '<div class="dist-progress-row"><span>' + esc(e[0]) + '</span>' +
 '<div class="dist-progress-track" aria-hidden="true"><div class="dist-progress-fill" style="width:' + pct + '%;background:' + color + '"></div></div>' +
 '<span class="dist-count">' + e[1] + '人</span></div>';
 });
 html += '</div></div>';
 return html;
 }

 function compactInsight(text, data) {
 var s = data.stats || {};
 var unsubmitted = data.unsubmittedStudents || [];
 if (text.indexOf("完成率") >= 0) {
 if ((s.completionRate || 0) < 50 || text.indexOf("偏低") >= 0) {
 return { label: "进度提醒", action: "完成率 " + (s.completionRate || 0) + "% 偏低，建议周三推送催交提醒。" };
 }
 if ((s.completionRate || 0) >= 80) {
 return { label: "表现稳定", action: "完成率 " + (s.completionRate || 0) + "%，班级参与度较高，保持当前节奏。" };
 }
 return { label: "进度观察", action: "完成率 " + (s.completionRate || 0) + "%，本周参与表现平稳。" };
 }
 if (text.indexOf("待点评") >= 0 || text.indexOf("反馈") >= 0) {
 if ((s.pendingFeedback || 0) === 0) {
 return { label: "反馈完成", action: "本周提交均已点评，反馈节奏良好。" };
 }
 return { label: "待办急件", action: (s.pendingFeedback || 0) + " 份作业待点评，优先完成反馈。" };
 }
 if (text.indexOf("祖辈") >= 0) {
 var target = unsubmitted.find(function (u) {
 return String(u.caregiver || "").indexOf("奶奶") >= 0 ||
 String(u.caregiver || "").indexOf("爷爷") >= 0 ||
 String(u.caregiver || "").indexOf("外婆") >= 0 ||
 String(u.caregiver || "").indexOf("外公") >= 0;
 });
 return { label: "特殊关怀", action: (target ? target.name + "家庭" : "祖辈带养家庭") + "暂未提交，建议电话或微信轻量跟进。" };
 }
 if (text.indexOf("个性化") >= 0) {
 return { label: "分层推进", action: "已为 " + (s.personalTaskCount || 0) + " 个学生任务做差异化安排，持续观察完成质量。" };
 }
 if (text.indexOf("兴趣") >= 0) {
 return { label: "下周选题", action: text.replace(/^班级兴趣热点：/, "兴趣热点：").replace(/，可据此设计下周任务方向$/, "，可作为下周任务主题。") };
 }
 return { label: "观察", action: text };
 }

 function getInsightTiming(action) {
 if (action.indexOf("周三") >= 0 || action.indexOf("提醒") >= 0 || action.indexOf("催交") >= 0) return "定时周三发";
 if (action.indexOf("反馈") >= 0 || action.indexOf("点评") >= 0) return "安排点评";
 if (action.indexOf("下周") >= 0 || action.indexOf("主题") >= 0) return "加入下周任务";
 return "稍后跟进";
 }

 function renderInsightCard(compact, index) {
 var timing = getInsightTiming(compact.action);
 return '<li class="insight-card"><div class="insight-card-main"><span class="insight-label">' + esc(compact.label) +
 '</span><span class="insight-action">' + esc(compact.action) + '</span></div>' +
 '<div class="insight-actions"><button type="button" class="action-btn primary-action" data-insight-action="send" data-index="' + index + '">立即发送</button>' +
 '<button type="button" class="action-btn" data-insight-action="schedule" data-index="' + index + '">' + esc(timing) + '</button></div></li>';
 }

 function renderUnsubmittedTable(list) {
 var html = '<div class="attention-toolbar"><button type="button" class="bulk-action" data-remind="selected">批量催交</button>' +
 '<button type="button" class="bulk-action secondary" data-remind="all">提醒全部未交（' + list.length + '人）</button></div>';
 html += '<div class="unsubmitted-table-wrap"><table class="unsubmitted-table"><thead><tr>' +
 '<th><input class="select-all" type="checkbox" aria-label="全选未提交学生"></th>' +
 '<th><button type="button" class="sort-btn" data-sort="name">学生</button></th>' +
 '<th><button type="button" class="sort-btn" data-sort="grade">年级</button></th>' +
 '<th><button type="button" class="sort-btn" data-sort="caregiver">主要陪伴人</button></th>' +
 '<th><button type="button" class="sort-btn" data-sort="status">状态</button></th><th>快捷操作</th></tr></thead>' +
 '<tbody id="unsubmittedTableBody">' + renderUnsubmittedRows(list, "name", 1) + '</tbody></table></div>';
 html += '<div class="mobile-card-list">';
 list.forEach(function (u) {
 html += '<article class="student-remind-card"><div><strong>' + esc(u.name) + '</strong><span>' +
 esc(u.caregiver || "未填写陪伴人") + ' · 未提交</span></div><div class="mobile-card-actions">' +
 '<button type="button" class="icon-action" data-remind="one" data-name="' + esc(u.name) + '" aria-label="微信提醒' + esc(u.name) + '">微</button>' +
 '<button type="button" class="icon-action" data-remind="call" data-name="' + esc(u.name) + '" aria-label="电话提醒' + esc(u.name) + '">☎</button></div></article>';
 });
 html += '</div>';
 return html;
 }

 function renderUnsubmittedRows(list, sortKey, dir) {
 var sorted = list.slice().sort(function (a, b) {
 var av = sortKey === "status" ? "未提交" : String(a[sortKey] || "");
 var bv = sortKey === "status" ? "未提交" : String(b[sortKey] || "");
 return av.localeCompare(bv, "zh-Hans-CN") * dir;
 });
 return sorted.map(function (u) {
 return '<tr><td><input class="row-check" type="checkbox" value="' + esc(u.id) + '" data-name="' + esc(u.name) + '" aria-label="选择' + esc(u.name) + '"></td>' +
 '<td class="student-cell">' + esc(u.name) + '</td><td>' + esc(u.grade || "未填写") + '</td><td>' +
 esc(u.caregiver || "未填写") + '</td><td><span class="status-pill">未提交</span></td>' +
 '<td><div class="table-actions"><button type="button" class="icon-action" data-remind="one" data-name="' + esc(u.name) + '" aria-label="微信提醒' + esc(u.name) + '">微</button>' +
 '<button type="button" class="icon-action" data-remind="call" data-name="' + esc(u.name) + '" aria-label="电话提醒' + esc(u.name) + '">☎</button></div></td></tr>';
 }).join("");
 }

 function showToast(message) {
 var toast = document.getElementById("overviewToast");
 if (!toast) return;
 toast.textContent = message;
 toast.classList.add("is-visible");
 clearTimeout(showToast.timer);
 showToast.timer = setTimeout(function () { toast.classList.remove("is-visible"); }, 2200);
 }

 function setupOverviewInteractions(data) {
 var bodyEl = document.body;
 var drawer = document.querySelector(".insight-col");
 var backdrop = document.querySelector(".mobile-insight-backdrop");
 var drawerTitle = document.querySelector(".mobile-drawer-title");
 var unsubmitted = data.unsubmittedStudents || [];
 var sortState = { key: "name", dir: 1 };

 function openDrawer(panel) {
 if (!drawer) return;
 drawer.setAttribute("data-active-panel", panel);
 if (drawerTitle) drawerTitle.textContent = panel === "parents" ? "家长证据" : "学情洞察与建议";
 bodyEl.classList.add("insight-drawer-open");
 }
 function closeDrawer() { bodyEl.classList.remove("insight-drawer-open"); }
 document.querySelectorAll("[data-mobile-panel]").forEach(function (btn) {
 btn.addEventListener("click", function () { openDrawer(btn.getAttribute("data-mobile-panel")); });
 });
 document.querySelectorAll("[data-close-drawer]").forEach(function (btn) { btn.addEventListener("click", closeDrawer); });
 if (backdrop) backdrop.addEventListener("click", closeDrawer);

 document.querySelectorAll("[data-insight-action]").forEach(function (btn) {
 btn.addEventListener("click", function () {
 var type = btn.getAttribute("data-insight-action");
 var label = type === "schedule" ? btn.textContent : "立即发送";
 showToast(label + "已生成，可在班级群模板中确认");
 if (typeof trackEvent === "function") trackEvent("teacher_contact_started", { meta: { source: "class_overview_insight", action: label } });
 });
 });

 function selectedNames() {
 return Array.prototype.slice.call(document.querySelectorAll(".row-check:checked")).map(function (el) { return el.getAttribute("data-name"); });
 }
 function sendReminder(kind, names) {
 var count = names && names.length ? names.length : unsubmitted.length;
 var text = kind === "call" ? "电话提醒入口已准备" : "提醒模板已生成";
 showToast(text + "：" + count + "人");
 if (typeof trackEvent === "function") trackEvent("teacher_contact_started", { meta: { source: "class_overview_unsubmitted", kind: kind, count: count } });
 }
 document.querySelectorAll("[data-remind]").forEach(function (btn) {
 btn.addEventListener("click", function () {
 var kind = btn.getAttribute("data-remind");
 if (kind === "selected") {
 var names = selectedNames();
 if (!names.length) { showToast("请先勾选需要催交的学生"); return; }
 sendReminder("selected", names);
 return;
 }
 if (kind === "one" || kind === "call") sendReminder(kind, [btn.getAttribute("data-name")]);
 else sendReminder("all", unsubmitted.map(function (u) { return u.name; }));
 });
 });
 var selectAll = document.querySelector(".select-all");
 if (selectAll) selectAll.addEventListener("change", function () {
 document.querySelectorAll(".row-check").forEach(function (el) { el.checked = selectAll.checked; });
 });
 document.querySelectorAll(".sort-btn").forEach(function (btn) {
 btn.addEventListener("click", function () {
 var key = btn.getAttribute("data-sort");
 sortState.dir = sortState.key === key ? sortState.dir * -1 : 1;
 sortState.key = key;
 var tbody = document.getElementById("unsubmittedTableBody");
 if (tbody) tbody.innerHTML = renderUnsubmittedRows(unsubmitted, sortState.key, sortState.dir);
 if (selectAll) selectAll.checked = false;
 setupOverviewInteractions.boundRows && setupOverviewInteractions.boundRows();
 });
 });
 setupOverviewInteractions.boundRows = function () {
 document.querySelectorAll("#unsubmittedTableBody [data-remind]").forEach(function (btn) {
 btn.addEventListener("click", function () {
 var kind = btn.getAttribute("data-remind");
 sendReminder(kind, [btn.getAttribute("data-name")]);
 });
 });
 };
 }

 api("/api/teacher/ai-overview").then(function (data) {
 var s = data.stats || {};
 var body = document.getElementById("overviewBody");

 if (s.totalStudents === 0) {
 body.innerHTML = '<p class="empty">暂无学生数据，等待家长绑定孩子或填写问卷</p>';
 return;
 }

 var left = '<div class="primary-col">';
 left += '<div class="stats-row">';
 left += '<div class="stat-box"><div class="stat-val ' +
 (s.completionRate >= 80 ? "ok" : s.completionRate < 50 ? "warn" : "ai") + '">' +
 (s.completionRate || 0) + '%</div><div class="stat-label">本周完成率</div>' +
 '<div class="stat-bar"><div class="stat-bar-fill ' +
 (s.completionRate >= 80 ? "ok" : s.completionRate < 50 ? "warn" : "ai") +
 '" style="width:' + (s.completionRate || 0) + '%"></div></div></div>';
 left += '<div class="stat-box"><div class="stat-val ' +
 (s.feedbackRate >= 80 ? "ok" : s.pendingFeedback > 0 ? "warn" : "ai") + '">' +
 (s.feedbackRate || 0) + '%</div><div class="stat-label">反馈覆盖率</div>' +
 '<div class="stat-bar"><div class="stat-bar-fill ' +
 (s.feedbackRate >= 80 ? "ok" : "ai") +
 '" style="width:' + (s.feedbackRate || 0) + '%"></div></div></div>';
 left += '<div class="stat-box"><div class="stat-val ' +
 (s.pendingFeedback > 0 ? "warn" : "ok") + '">' + (s.pendingFeedback || 0) +
 '</div><div class="stat-label">待点评</div></div>';
 left += '</div>';

 left += '<div class="mobile-insight-tabs"><button type="button" class="mobile-insight-tab" data-mobile-panel="insights">学情洞察</button><button type="button" class="mobile-insight-tab" data-mobile-panel="parents">家长证据</button></div>';

 left += '<section class="panel"><div class="panel-head"><div class="panel-title">当前任务与个性化名单</div><a class="panel-meta panel-link" href="teacher-publish.html">调整班级任务</a></div>';
 left += '<div class="task-card">';
 if (data.task) {
 left += '<div class="task-main"><span class="task-type">' + esc(data.task.task_type || "班级任务") + '</span><div>' +
 '<div class="task-name">' + esc(data.task.title) + '</div>' +
 '<div class="task-sub">班级任务 · 约 ' + (data.task.duration || 20) + ' 分钟</div></div></div>';
 } else {
 left += '<div class="task-main"><span class="task-type">待发布</span><div><div class="task-name">本周尚未发布班级任务</div><div class="task-sub">可前往发布任务页面创建本周任务</div></div></div>';
 }

 if (s.personalTaskCount > 0) {
 var pSet = {};
 (data.personalTasks || []).forEach(function (pt) {
 if (!pSet[pt.child_name]) pSet[pt.child_name] = [];
 pSet[pt.child_name].push(pt.title);
 });
 left += '<div class="personal-summary"><div class="personal-summary-title">已为 ' + Object.keys(pSet).length + ' 名学生定制</div><div class="personal-list">';
 Object.keys(pSet).forEach(function (name) {
 pSet[name].forEach(function (title) {
 left += '<div class="personal-row"><span class="pt-name">' + esc(name) +
 '</span><span>' + esc(title) + '</span></div>';
 });
 });
 left += '</div></div>';
 }
 if (!data.task && s.personalTaskCount === 0) {
 left += '<div class="personal-summary"><div class="personal-summary-title">暂无个性化任务</div></div>';
 }
 left += '</div></section>';

 var unsubmitted = data.unsubmittedStudents || [];
 left += '<section class="panel attention-section"><div class="panel-head"><div class="panel-title">本周尚未提交的学生</div><span class="panel-meta">' + unsubmitted.length + ' 人</span></div>';
 if (unsubmitted.length > 0) {
 left += renderUnsubmittedTable(unsubmitted);
 } else {
 left += '<p class="empty">本周全部学生已提交</p>';
 }
 left += '</section>';

 var distHtml = "";
 if (data.caregiverDistribution && Object.keys(data.caregiverDistribution).length > 0) {
 distHtml += renderDist('陪伴人分布', data.caregiverDistribution);
 }
 if (data.interestDistribution && Object.keys(data.interestDistribution).length > 0) {
 distHtml += renderDist('兴趣分布', data.interestDistribution);
 }
 if (distHtml) {
 left += '<section class="panel"><div class="panel-head"><div class="panel-title">班级画像分布</div><span class="panel-meta">问卷与档案</span></div><div class="dist-grid">' + distHtml + '</div></section>';
 }
 left += '</div>';

 var right = '<div class="mobile-insight-backdrop" data-close-drawer></div><aside class="insight-col" data-active-panel="insights"><div class="mobile-drawer-head"><span class="mobile-drawer-title">学情洞察与建议</span><button type="button" class="drawer-close" data-close-drawer aria-label="关闭面板">×</button></div>';
 var insights = data.insights || [];
 right += '<section class="panel" data-panel="insights"><div class="insights-title">学情洞察与建议</div>';
 if (insights.length > 0) {
 right += '<ul class="insights-list">';
 insights.slice(0, 5).forEach(function (ins, index) {
 var compact = compactInsight(ins, data);
 right += renderInsightCard(compact, index);
 });
 right += '</ul>';
 } else {
 right += '<p class="section-hint">暂无需要特别处理的洞察。</p>';
 }
 right += '</section>';

 var es = data.engagementSummary || {};
 var rows = data.engagementRows || [];
 if (rows.length > 0) {
 right += '<section class="panel" data-panel="parents"><div class="panel-head"><div class="panel-title">家长主动关注证据</div><span class="panel-meta">近30天</span></div>';
 right += '<p class="section-hint">仅展示站内行为证据，不作为家长关心程度的绝对评价。</p>';
 right += '<div class="engagement-grid">';
 right += '<div class="engagement-box"><div class="num ok">' + (es.high || 0) + '</div><div class="label">证据较高</div></div>';
 right += '<div class="engagement-box"><div class="num ai">' + (es.medium || 0) + '</div><div class="label">有一定证据</div></div>';
 right += '<div class="engagement-box"><div class="num warn">' + (es.low || 0) + '</div><div class="label">证据较少</div></div>';
 right += '<div class="engagement-box"><div class="num">' + (es.insufficient || 0) + '</div><div class="label">证据不足</div></div>';
 right += '</div>';
 rows.slice().sort(function (a, b) {
 return (a.engagement.score || 0) - (b.engagement.score || 0);
 }).slice(0, 3).forEach(function (r) {
 var eg = r.engagement || {};
 var evidence = (eg.evidence || []).length ? eg.evidence.slice(0, 1).join("；") : "暂无足够站内行为证据";
 right += '<div class="parent-row"><div class="parent-row-head"><div><span class="parent-name">' +
 esc(r.childName) + '</span><span class="parent-level"> · ' + esc(r.caregiver || "家长") +
 '</span></div><span class="badge-wait">' + esc(eg.level || "证据不足") +
 ' · ' + esc(eg.confidence || "低") + '置信度</span></div>';
 right += '<div class="parent-evidence">' + esc(evidence) + '</div>';
 right += '<div class="parent-action">建议：' + esc(eg.recommendation || "先提供一次清晰摘要") + '</div></div>';
 });
 right += '</section>';
 }
 right += '</aside>';

 body.innerHTML = '<div class="overview-layout">' + left + right + '</div>' +
 '<div class="mobile-reminder-bar ' + (unsubmitted.length > 0 ? 'is-visible' : '') + '"><button type="button" class="mobile-reminder-btn" data-remind="all">一键提醒全部未交（' + unsubmitted.length + '人）</button></div>' +
 '<div class="toast" id="overviewToast" role="status" aria-live="polite"></div>';
 setupOverviewInteractions(data);
 }).catch(function () {
 document.getElementById("overviewBody").innerHTML =
 '<p class="empty">数据加载失败，请刷新重试</p>';
 });
 })();
 </script></body></html>
