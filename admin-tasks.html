<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>已发布任务 · 家校共育</title>
  <link rel="stylesheet" href="css/refined-ui.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body class="admin-page admin-tasks-page">
  <header class="topbar">
    <span class="brand">管理员工作台</span>
    <nav class="teacher-nav" aria-label="管理员导航">
      <a class="nav-link" href="admin.html">账号管理</a>
      <a class="nav-link active" href="admin-tasks.html">已发布任务</a>
      <a class="nav-link" href="teacher-ai.html">AI 洞察</a>
      <a class="nav-link" href="teacher-students.html">学生档案</a>
    </nav>
    <div class="top-actions">
      <span class="user-name" id="userName"></span>
      <button class="btn-logout" id="logoutBtn" type="button">退出登录</button>
    </div>
  </header>

  <main class="admin-main">
    <section class="admin-heading task-heading" aria-labelledby="taskTitle">
      <div>
        <span class="eyebrow">任务管理 / 完成进度</span>
        <h1 id="taskTitle">已发布任务</h1>
        <p>按任务查看学生完成情况，展开后可查看每位学生的提交详情。</p>
      </div>
      <label class="task-filter">筛选
        <select id="taskFilter" aria-label="筛选任务">
          <option value="all">全部任务</option>
          <option value="incomplete">仍有未完成</option>
          <option value="completed">全部完成</option>
        </select>
      </label>
    </section>
    <p class="task-result-note" id="taskResultNote">正在同步任务…</p>
    <section class="task-list" id="taskList" aria-live="polite">
      <div class="task-state">正在加载已发布任务…</div>
    </section>
  </main>

  <script src="js/api.js"></script>
  <script src="js/admin-tasks.js"></script>
</body>
</html>
